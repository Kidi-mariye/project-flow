server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20M;

    # Hashed static assets get long-lived caching; the SPA index.html never
    # gets cached so new deploys are picked up immediately.
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (e.g. /dashboard) fall through to index.php, which
    # serves the SPA (see routes/web.php). API paths are matched first.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
