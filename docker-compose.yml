name: task-manager

# The app, scheduler, and queue worker all run from the same image so the
# codebase is built once.
x-app: &x-app
  image: ${APP_IMAGE:-task-manager:local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: backend/.env
  restart: unless-stopped
  networks:
    - internal

services:
  # PHP-FPM behind Nginx.
  app:
    <<: *x-app
    volumes:
      - app_storage:/var/www/backend/storage
      - app_database:/var/www/backend/database
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Scheduled tasks (reminders every minute, nightly backup). `schedule:work`
  # replaces a cron entry and runs `schedule:run` every minute in the foreground.
  schedule:
    <<: *x-app
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/backend/storage
      - app_database:/var/www/backend/database
    depends_on:
      app:
        condition: service_healthy

  # Queue worker (used if emails/jobs are ever queued; harmless while idle).
  queue:
    <<: *x-app
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    volumes:
      - app_storage:/var/www/backend/storage
      - app_database:/var/www/backend/database
    depends_on:
      app:
        condition: service_healthy

  # Edge: terminates TLS at a reverse proxy / LB in front, or point this at
  # port 80 and terminate TLS with Caddy/LB. SPA + API share this origin.
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

volumes:
  app_storage:
  app_database:

networks:
  internal:
